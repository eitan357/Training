name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy to Firebase Hosting
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only hosting --project training-3f519 2>&1 | tee /tmp/deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          if [ $DEPLOY_EXIT -ne 0 ]; then
            if grep -q "is the current active version" /tmp/deploy.log; then
              echo "✓ Version is already the current active version — content is up to date."
              exit 0
            fi
            exit $DEPLOY_EXIT
          fi
